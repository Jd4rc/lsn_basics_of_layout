{% extends 'base.html' %}

{% block title %}{{ category.name }}{% endblock %}

{% block content %}

<h1>{{ category.name }}</h1>

<ul>
  {% for product in products %}
    <li>{{ product.name }} — {{ product.price }} ₽</li>
  {% empty %}
    <li>Товаров пока нет</li>
  {% endfor %}
</ul>

{% endblock %}
